<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScanReady</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <section id="screen-scan" aria-labelledby="scan-title">
      <h1 id="scan-title">My Scan</h1>
      <p class="lead">Hi Anita. Let's get you ready for your scan, one step at a time.</p>
      <h2>Your documents</h2>
      <ul id="doc-list" class="cards" aria-live="polite"></ul>
      <button id="build-plan" class="primary" type="button">Build my plan</button>
      <p id="scan-status" role="status"></p>
    </section>

    <section id="screen-plan" aria-labelledby="plan-title" hidden>
      <button class="link" type="button" data-go="scan">&larr; Back to My Scan</button>
      <h1 id="plan-title" tabindex="-1">Your plan</h1>
      <p id="plan-note" class="note" role="status" hidden></p>
      <div id="plan-headline" class="headline"></div>
      <p id="plan-summary" class="summary"></p>
      <div id="plan-discrepancies"></div>
      <h2>What needs your attention</h2>
      <ul id="blocker-list" class="cards"></ul>
      <h2>Before you go</h2>
      <ul id="task-list" class="cards"></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
